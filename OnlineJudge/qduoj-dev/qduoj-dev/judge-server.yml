version: "3"
# ==========================================================
#  JudgeServer 判题机 (独立容器, 与后端通过 TOKEN 认证)
#  放 OnlineJudge 目录下, 启动时务必带 -p judge-server
#    docker compose -f judge-server.yml -p judge-server up -d
# ==========================================================
services:
  judge-server:
    image: registry.cn-hangzhou.aliyuncs.com/onlinejudge/judge_server
    container_name: judge-server
    restart: always
    read_only: true
    cap_drop:
      - SETPCAP
      - MKNOD
      - NET_BIND_SERVICE
      - SYS_CHROOT
      - SETFCAP
      - FSETID
    tmpfs:
      - /tmp
    volumes:
      # 后端写测试用例的目录, 判题机只读挂载
      - ./data/test_case:/test_case:ro
      - ./data_dev/judge_server/log:/log
      - ./data_dev/judge_server/run:/judger
    environment:
      # 后端访问判题机用的地址(宿主机端口映射后的地址)
      - SERVICE_URL=http://127.0.0.1:12358
      # 判题机向后端发心跳的地址; host.docker.internal 指回 WSL2 宿主
      - BACKEND_URL=http://host.docker.internal:8000/api/judge_server_heartbeat/
      # 必须与后端 JUDGE_SERVER_TOKEN 完全一致
      - TOKEN=CHANGE_THIS
      # 调试期打开: 判题日志保留, 出错时看得到
      - judger_debug=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "12358:8080"
